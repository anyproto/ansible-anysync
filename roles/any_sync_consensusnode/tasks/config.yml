---
- name: Copy config file
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ any_sync_consensusnode_config_path }}/config.yml"
    mode: "0644"
  notify: Restart service

- name: Copy systemd init file
  ansible.builtin.template:
    src: service.j2
    dest: /etc/systemd/system/any-sync-consensusnode.service
    mode: "0644"
  notify: Restart service
